<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kenanganku</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C98A4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kenanganku">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg: #FBF6EE;
    --card: #FFFFFF;
    --ink: #332C25;
    --muted: #8A7F72;
    --accent: #C98A4B;
    --accent-soft: rgba(201,138,75,0.14);
    --rose: #D2727C;
    --rose-soft: rgba(210,114,124,0.13);
    --sage: #7E9470;
    --sage-soft: rgba(126,148,112,0.14);
    --border: #ECE2D2;
    --shadow: 0 10px 28px rgba(51,44,37,0.09);
    --radius: 20px;
    --radius-sm: 12px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .serif{ font-family: 'Fraunces', serif; }
  button{ font-family: inherit; cursor:pointer; }
  img{ -webkit-user-drag:none; }

  /* ---------- Hero ---------- */
  .hero{ padding: 30px 20px 16px; text-align:center; }
  .hero h1{ font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size: 30px; margin:0; color: var(--ink); }
  .hero .tagline{ color: var(--muted); font-size: 13.5px; margin: 5px 0 18px; }
  .add-btn{
    background: var(--accent); color:#fff; border:none;
    padding: 13px 24px; border-radius: 999px; font-weight:600; font-size: 14.5px;
    box-shadow: 0 8px 20px rgba(201,138,75,0.3);
  }
  .stat-line{ margin-top: 10px; color: var(--muted); font-size: 12.5px; }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; justify-content:center; gap:4px; padding: 4px; margin: 0 20px 14px;
    background: var(--card); border-radius: 999px; border:1px solid var(--border);
    max-width: 360px; margin-left:auto; margin-right:auto;
  }
  .tab{
    flex:1; text-align:center; padding: 9px 6px; border:none; background:transparent;
    color: var(--muted); border-radius: 999px; font-size: 13px; font-weight:500;
  }
  .tab.active{ background: var(--accent-soft); color: var(--accent); font-weight:600; }

  .search-wrap{ padding: 0 20px 16px; max-width: 480px; margin: 0 auto; }
  .search-wrap-inner{ position:relative; }
  .search-wrap input{
    width:100%; background: var(--card); border:1px solid var(--border); color: var(--ink);
    padding: 12px 14px 12px 40px; border-radius: 999px; font-size:14px; outline:none;
  }
  .search-wrap input:focus{ border-color: var(--accent); }
  .search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.6; font-size:14px; }

  .content{ padding: 0 20px 90px; max-width: 560px; margin: 0 auto; }

  /* ---------- Today banner ---------- */
  .today-banner{
    background: linear-gradient(135deg, var(--rose-soft), var(--accent-soft));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 18px;
    display:flex; gap: 12px; align-items:center; position:relative;
  }
  .today-banner img{ width:52px; height:52px; border-radius: var(--radius-sm); object-fit:cover; flex-shrink:0; }
  .today-banner .ph{ width:52px; height:52px; border-radius: var(--radius-sm); background: var(--card); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .today-banner .txt{ flex:1; }
  .today-banner .lead{ font-size:11.5px; color: var(--rose); font-weight:600; margin-bottom:2px; }
  .today-banner .cap{ font-size: 13px; color: var(--ink); line-height:1.35; }
  .today-banner .dismiss{ background:none; border:none; color: var(--muted); font-size:15px; align-self:flex-start; padding:2px; }

  /* ---------- Timeline ---------- */
  .timeline{ position:relative; }
  .t-item{ position:relative; padding-left: 26px; margin-bottom: 22px; }
  .t-item::before{
    content:''; position:absolute; left:5px; top:6px; bottom:-22px; width:1.5px; background: var(--border);
  }
  .t-item:last-child::before{ display:none; }
  .t-dot{ position:absolute; left:0; top:6px; width:12px; height:12px; border-radius:50%; background: var(--accent); border:2.5px solid var(--bg); box-shadow: 0 0 0 1.5px var(--border); }
  .t-date{ font-size:11.5px; color: var(--muted); margin-bottom:8px; }

  .m-card{
    background: var(--card); border-radius: var(--radius); overflow:hidden;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .m-photo{ width:100%; aspect-ratio: 4/3; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:40px; overflow:hidden; }
  .m-photo img{ width:100%; height:100%; object-fit:cover; }
  .m-body{ padding: 14px 16px 16px; }
  .m-title{ font-family:'Fraunces', serif; font-weight:600; font-size: 17px; margin-bottom:6px; }
  .m-meta{ display:flex; flex-wrap:wrap; gap: 10px; color: var(--muted); font-size:12px; margin-bottom:10px; }
  .m-caption{ font-family:'Fraunces', serif; font-style:italic; font-size: 13.5px; line-height:1.55; color: var(--ink); }
  .m-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .m-tag{ background: var(--sage-soft); color: var(--sage); font-size:11px; padding:4px 10px; border-radius:999px; font-weight:500; }

  /* ---------- Gallery ---------- */
  .gallery-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: var(--radius); overflow:hidden; }
  .g-tile{ aspect-ratio:1; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; border:none; padding:0; }
  .g-tile img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Map ---------- */
  #mapView{ display:none; }
  #mapContainer{ width:100%; height: 62vh; border-radius: var(--radius); overflow:hidden; border:1px solid var(--border); }
  .map-popup{ font-family:'Inter',sans-serif; text-align:center; }
  .map-popup img{ width: 120px; height:80px; object-fit:cover; border-radius:8px; margin-bottom:6px; }
  .map-popup .cap{ font-size:12px; max-width:130px; }
  .map-popup button{ margin-top:6px; background: var(--accent); color:#fff; border:none; padding:5px 10px; border-radius:8px; font-size:11px; }

  .empty-state{ text-align:center; padding: 70px 20px; color: var(--muted); }
  .empty-state .glyph{ font-size:38px; margin-bottom:12px; }
  .empty-state p{ font-size:14px; line-height:1.6; max-width:280px; margin:0 auto; }

  /* ---------- Overlay / sheet ---------- */
  .overlay{ position:fixed; inset:0; background: rgba(51,44,37,0.45); display:none; align-items:flex-end; justify-content:center; z-index:60; }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--bg); width:100%; max-width: 520px; max-height:92vh; overflow-y:auto;
    border-radius: 24px 24px 0 0; border:1px solid var(--border); border-bottom:none;
    animation: slideUp .22s ease; padding-bottom:26px;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:36px; height:4px; background: var(--border); border-radius:2px; margin:10px auto 4px; }
  .sheet-close{ position:sticky; top:0; display:flex; justify-content:flex-end; padding:6px 14px 0; background: var(--bg); }
  .sheet-close button{ background: var(--card); border:1px solid var(--border); color: var(--muted); width:30px; height:30px; border-radius:50%; font-size:15px; }

  .detail-photo{ width: calc(100% - 32px); margin: 4px 16px 0; aspect-ratio:4/3.2; border-radius: var(--radius); overflow:hidden; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:50px; }
  .detail-photo img{ width:100%; height:100%; object-fit:cover; }
  .detail-body{ padding: 18px 20px 4px; }
  .detail-title{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin-bottom:10px; }
  .detail-meta{ display:flex; flex-wrap:wrap; gap:14px; color: var(--muted); font-size:12.5px; margin-bottom:14px; }
  .detail-caption{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.65; color: var(--ink); margin-bottom: 14px; }
  .detail-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 6px; }
  .detail-actions{ display:flex; gap:10px; padding: 10px 20px 0; }
  .detail-actions button{ flex:1; padding:12px; border-radius: var(--radius-sm); font-weight:600; font-size:13.5px; border:none; }
  .btn-edit{ background: var(--card); border:1px solid var(--border) !important; color: var(--ink); }
  .btn-delete{ background: var(--rose-soft); color: var(--rose); }

  .form-title{ padding: 4px 20px 2px; font-size:18px; font-weight:600; font-family:'Fraunces',serif; }
  .form-body{ padding: 6px 20px 6px; display:flex; flex-direction:column; gap:14px; }
  .field label{ display:block; font-size:12.5px; color: var(--muted); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; background: var(--card); border:1px solid var(--border); color: var(--ink);
    padding: 11px 12px; border-radius: var(--radius-sm); font-size:14.5px; font-family:'Inter',sans-serif; outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color: var(--accent); }
  .field textarea{ resize:vertical; min-height: 74px; }
  .photo-picker{ display:flex; gap:10px; align-items:center; }
  .photo-preview{ width:76px; height:76px; border-radius: var(--radius-sm); background: var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; flex-shrink:0; border:1px solid var(--border); }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .photo-btns{ display:flex; flex-direction:column; gap:8px; flex:1; }
  .photo-btns label{ background: var(--card); border:1px solid var(--border); color: var(--ink); padding:9px 12px; border-radius: var(--radius-sm); font-size:13px; text-align:center; display:block; }
  .loc-btn{ background: var(--sage-soft); color: var(--sage); border:1px solid transparent; padding: 11px 12px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight:600; width:100%; text-align:left; }
  .loc-btn .sub{ display:block; font-weight:400; font-size:11.5px; margin-top:2px; opacity:.85; }
  .form-submit{ margin-top:4px; background: var(--accent); color:#fff; border:none; font-weight:700; padding:14px; border-radius: var(--radius-sm); font-size:14.5px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff; padding: 11px 18px; border-radius:999px; font-size:13.5px; z-index:80;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2); opacity:0; transition: opacity .2s, transform .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }

  @media (min-width: 560px){
    .sheet{ border-radius:24px; margin-bottom:24px; }
    .overlay{ align-items:center; }
  }
</style>
</head>
<body>

  <div class="hero">
    <h1>Kenanganku</h1>
    <p class="tagline">Simpan momen, abadikan cerita</p>
    <button class="add-btn" id="addBtn">+ Tambah Kenangan</button>
    <div class="stat-line" id="statLine"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="timeline">📖 Timeline</button>
    <button class="tab" data-view="gallery">🖼️ Galeri</button>
    <button class="tab" data-view="map">🗺️ Peta</button>
  </div>

  <div class="search-wrap">
    <div class="search-wrap-inner">
      <span class="search-icon">🔎</span>
      <input id="searchInput" type="text" placeholder="Cari caption, tempat, atau kategori...">
    </div>
  </div>

  <div class="content">
    <div id="todayBanner"></div>

    <div id="timelineView"></div>
    <div id="galleryView" style="display:none;"></div>
    <div id="mapView">
      <div id="mapContainer"></div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="glyph">🫙</div>
      <p id="emptyText">Belum ada kenangan tersimpan. Yuk mulai simpan momen pertamamu.</p>
    </div>
  </div>

  <!-- Detail sheet -->
  <div class="overlay" id="detailOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-close"><button id="detailClose">✕</button></div>
      <div class="detail-photo" id="detailPhoto"></div>
      <div class="detail-body">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-caption" id="detailCaption"></div>
        <div class="detail-tags" id="detailTags"></div>
      </div>
      <div class="detail-actions">
        <button class="btn-edit" id="detailEditBtn">Edit</button>
        <button class="btn-delete" id="detailDeleteBtn">Hapus</button>
      </div>
    </div>
  </div>

  <!-- Form sheet -->
  <div class="overlay" id="formOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-close"><button id="formClose">✕</button></div>
      <div class="form-title" id="formTitle">Tambah Kenangan</div>
      <div class="form-body">
        <div class="field">
          <label>Foto</label>
          <div class="photo-picker">
            <div class="photo-preview" id="photoPreview">🖼️</div>
            <div class="photo-btns">
              <label>Ambil foto<input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none;"></label>
              <label>Pilih dari galeri<input type="file" accept="image/*" id="galleryInput" style="display:none;"></label>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Judul singkat</label>
          <input type="text" id="fTitle" placeholder="cth. Liburan Bersama Teman">
        </div>
        <div class="field">
          <label>Caption</label>
          <textarea id="fCaption" placeholder="Ceritakan momen ini..."></textarea>
        </div>
        <div class="field">
          <label>Lokasi</label>
          <button type="button" class="loc-btn" id="locBtn">📍 Ambil lokasi otomatis<span class="sub" id="locSub">Butuh izin GPS perangkat</span></button>
          <input type="text" id="fLocation" placeholder="Atau tulis lokasi manual" style="margin-top:8px;">
        </div>
        <div class="field">
          <label>Tanggal & waktu</label>
          <input type="datetime-local" id="fDatetime">
        </div>
        <div class="field">
          <label>Kategori / tag (pisahkan dengan koma)</label>
          <input type="text" id="fTags" placeholder="cth. liburan, teman, PKL">
        </div>
        <button class="form-submit" id="formSubmit">Simpan Kenangan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  let db = null;
  let allItems = [];
  let currentView = "timeline";
  let editingId = null;
  let pendingPhoto = null;
  let pendingLat = null;
  let pendingLng = null;
  let currentDetailItem = null;
  let leafletMap = null;
  let mapMarkers = [];

  // ---------- IndexedDB ----------
  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("kenanganku", 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("memories")) {
          d.createObjectStore("memories", { keyPath: "id", autoIncrement: true });
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e);
    });
  }
  function getAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction("memories", "readonly");
      const req = tx.objectStore("memories").getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }
  function putItem(item){
    return new Promise((resolve, reject) => {
      const tx = db.transaction("memories", "readwrite");
      const req = tx.objectStore("memories").put(item);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }
  function deleteItem(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction("memories", "readwrite");
      const req = tx.objectStore("memories").delete(id);
      req.onsuccess = () => resolve();
      req.onerror = e => reject(e);
    });
  }

  // ---------- Helpers ----------
  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" });
  }
  function fmtDateTime(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" }) + ", " +
      d.toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });
  }
  function tagsToArray(str){
    return (str||"").split(",").map(s=>s.trim()).filter(Boolean);
  }
  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  // ---------- "On this day" ----------
  function findOnThisDay(items){
    const today = new Date();
    let best = null;
    let bestYears = 0;
    items.forEach(it => {
      const d = new Date(it.datetime);
      if (d.getMonth() === today.getMonth() && d.getDate() === today.getDate() && d.getFullYear() < today.getFullYear()) {
        const years = today.getFullYear() - d.getFullYear();
        if (years > bestYears || !best) { best = it; bestYears = years; }
      }
    });
    return best ? { item: best, years: bestYears } : null;
  }
  let dismissedToday = false;
  function renderTodayBanner(){
    const wrap = document.getElementById("todayBanner");
    if (currentView !== "timeline" || dismissedToday) { wrap.innerHTML = ""; return; }
    const found = findOnThisDay(allItems);
    if (!found) { wrap.innerHTML = ""; return; }
    const { item, years } = found;
    wrap.innerHTML = `
      <div class="today-banner">
        ${item.photo ? `<img src="${item.photo}">` : `<div class="ph">🖼️</div>`}
        <div class="txt">
          <div class="lead">❤️ ${years} tahun yang lalu</div>
          <div class="cap">${escapeHtml(item.title || item.caption || "")}</div>
        </div>
        <button class="dismiss" id="dismissToday">✕</button>
      </div>
    `;
    wrap.querySelector(".today-banner").addEventListener("click", (e) => {
      if (e.target.id === "dismissToday") { dismissedToday = true; renderTodayBanner(); return; }
      openDetail(item);
    });
  }

  // ---------- Filtering ----------
  function matches(item, q){
    if (!q) return true;
    q = q.toLowerCase();
    return (item.title||"").toLowerCase().includes(q)
      || (item.caption||"").toLowerCase().includes(q)
      || (item.location||"").toLowerCase().includes(q)
      || (item.tags||[]).join(" ").toLowerCase().includes(q);
  }
  function filteredSorted(){
    const q = document.getElementById("searchInput").value.trim();
    return allItems.filter(i => matches(i, q)).sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
  }

  // ---------- Render: Timeline ----------
  function renderTimeline(){
    const list = filteredSorted();
    const view = document.getElementById("timelineView");
    toggleEmpty(list.length === 0);
    if (list.length === 0) { view.innerHTML = ""; return; }
    view.innerHTML = `<div class="timeline">${list.map(it => `
      <div class="t-item" data-id="${it.id}">
        <div class="t-dot"></div>
        <div class="t-date">${fmtDateTime(it.datetime)}</div>
        <div class="m-card">
          <div class="m-photo">${it.photo ? `<img src="${it.photo}">` : "📸"}</div>
          <div class="m-body">
            <div class="m-title">${escapeHtml(it.title || "Tanpa judul")}</div>
            <div class="m-meta">
              ${it.location ? `<span>📍 ${escapeHtml(it.location)}</span>` : ""}
            </div>
            ${it.caption ? `<div class="m-caption">"${escapeHtml(it.caption)}"</div>` : ""}
            ${(it.tags && it.tags.length) ? `<div class="m-tags">${it.tags.map(t=>`<span class="m-tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
          </div>
        </div>
      </div>
    `).join("")}</div>`;
    view.querySelectorAll(".t-item").forEach(el => {
      el.addEventListener("click", () => {
        const item = allItems.find(i => i.id == el.dataset.id);
        if (item) openDetail(item);
      });
    });
  }

  // ---------- Render: Gallery ----------
  function renderGallery(){
    const list = filteredSorted();
    const view = document.getElementById("galleryView");
    toggleEmpty(list.length === 0);
    if (list.length === 0) { view.innerHTML = ""; return; }
    view.innerHTML = `<div class="gallery-grid">${list.map(it => `
      <button class="g-tile" data-id="${it.id}">${it.photo ? `<img src="${it.photo}">` : "📸"}</button>
    `).join("")}</div>`;
    view.querySelectorAll(".g-tile").forEach(el => {
      el.addEventListener("click", () => {
        const item = allItems.find(i => i.id == el.dataset.id);
        if (item) openDetail(item);
      });
    });
  }

  // ---------- Render: Map ----------
  function ensureMap(){
    if (leafletMap) return;
    leafletMap = L.map('mapContainer').setView([-7.6298, 111.5239], 6); // default: Madiun area
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(leafletMap);
  }
  function renderMap(){
    ensureMap();
    mapMarkers.forEach(m => leafletMap.removeLayer(m));
    mapMarkers = [];
    const list = filteredSorted().filter(i => i.lat != null && i.lng != null);
    toggleEmpty(false); // map shows its own state
    if (list.length === 0) {
      document.getElementById("emptyState").style.display = "block";
      document.getElementById("emptyText").textContent = "Belum ada kenangan dengan lokasi GPS.";
      document.getElementById("mapView").style.display = "none";
      return;
    }
    document.getElementById("emptyState").style.display = "none";
    document.getElementById("mapView").style.display = "block";
    setTimeout(() => leafletMap.invalidateSize(), 80);
    const bounds = [];
    list.forEach(it => {
      const marker = L.marker([it.lat, it.lng]).addTo(leafletMap);
      const popupEl = document.createElement("div");
      popupEl.className = "map-popup";
      popupEl.innerHTML = `
        ${it.photo ? `<img src="${it.photo}">` : ""}
        <div class="cap">${escapeHtml(it.title || it.caption || "")}</div>
        <button>Lihat detail</button>
      `;
      popupEl.querySelector("button").onclick = () => openDetail(it);
      marker.bindPopup(popupEl);
      mapMarkers.push(marker);
      bounds.push([it.lat, it.lng]);
    });
    if (bounds.length) leafletMap.fitBounds(bounds, { padding:[30,30], maxZoom: 13 });
  }

  function toggleEmpty(isEmpty){
    document.getElementById("emptyState").style.display = isEmpty ? "block" : "none";
    if (isEmpty) document.getElementById("emptyText").textContent = "Belum ada kenangan tersimpan. Yuk mulai simpan momen pertamamu.";
  }

  function renderCurrentView(){
    document.getElementById("timelineView").style.display = currentView === "timeline" ? "block" : "none";
    document.getElementById("galleryView").style.display = currentView === "gallery" ? "block" : "none";
    document.getElementById("mapView").style.display = currentView === "map" ? "block" : "none";
    document.getElementById("emptyState").style.display = "none";
    renderTodayBanner();
    if (currentView === "timeline") renderTimeline();
    else if (currentView === "gallery") renderGallery();
    else renderMap();
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentView = tab.dataset.view;
      renderCurrentView();
    });
  });
  document.getElementById("searchInput").addEventListener("input", renderCurrentView);

  function updateStatLine(){
    document.getElementById("statLine").textContent = allItems.length
      ? `❤️ ${allItems.length} kenangan tersimpan`
      : "";
  }

  // ---------- Detail ----------
  function openDetail(item){
    currentDetailItem = item;
    document.getElementById("detailPhoto").innerHTML = item.photo ? `<img src="${item.photo}">` : "📸";
    document.getElementById("detailTitle").textContent = item.title || "Tanpa judul";
    const metaParts = [];
    if (item.location) metaParts.push(`📍 ${escapeHtml(item.location)}`);
    metaParts.push(`📅 ${fmtDateTime(item.datetime)}`);
    document.getElementById("detailMeta").innerHTML = metaParts.map(p=>`<span>${p}</span>`).join("");
    document.getElementById("detailCaption").textContent = item.caption ? `"${item.caption}"` : "Belum ada caption.";
    document.getElementById("detailTags").innerHTML = (item.tags||[]).map(t=>`<span class="m-tag">${escapeHtml(t)}</span>`).join("");
    document.getElementById("detailOverlay").classList.add("show");
  }
  document.getElementById("detailClose").onclick = () => document.getElementById("detailOverlay").classList.remove("show");
  document.getElementById("detailOverlay").addEventListener("click", e => { if (e.target.id === "detailOverlay") e.currentTarget.classList.remove("show"); });

  document.getElementById("detailEditBtn").onclick = () => {
    document.getElementById("detailOverlay").classList.remove("show");
    openForm(currentDetailItem);
  };
  document.getElementById("detailDeleteBtn").onclick = async () => {
    if (!confirm(`Hapus kenangan "${currentDetailItem.title || ''}"?`)) return;
    await deleteItem(currentDetailItem.id);
    document.getElementById("detailOverlay").classList.remove("show");
    allItems = await getAll();
    updateStatLine();
    renderCurrentView();
    showToast("Kenangan dihapus");
  };

  // ---------- Form ----------
  function toLocalInputValue(date){
    const pad = n => String(n).padStart(2,"0");
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function openForm(item){
    editingId = item ? item.id : null;
    pendingPhoto = item ? item.photo : null;
    pendingLat = item ? item.lat : null;
    pendingLng = item ? item.lng : null;
    document.getElementById("formTitle").textContent = item ? "Edit Kenangan" : "Tambah Kenangan";
    document.getElementById("fTitle").value = item ? (item.title||"") : "";
    document.getElementById("fCaption").value = item ? (item.caption||"") : "";
    document.getElementById("fLocation").value = item ? (item.location||"") : "";
    document.getElementById("fTags").value = item ? (item.tags||[]).join(", ") : "";
    document.getElementById("fDatetime").value = toLocalInputValue(item ? new Date(item.datetime) : new Date());
    document.getElementById("locSub").textContent = "Butuh izin GPS perangkat";
    updatePhotoPreview();
    document.getElementById("formOverlay").classList.add("show");
  }
  document.getElementById("formClose").onclick = () => document.getElementById("formOverlay").classList.remove("show");
  document.getElementById("formOverlay").addEventListener("click", e => { if (e.target.id === "formOverlay") e.currentTarget.classList.remove("show"); });
  document.getElementById("addBtn").onclick = () => openForm(null);

  function updatePhotoPreview(){
    document.getElementById("photoPreview").innerHTML = pendingPhoto ? `<img src="${pendingPhoto}">` : "🖼️";
  }
  function compressImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  async function handlePhotoInput(e){
    const file = e.target.files[0];
    if (!file) return;
    pendingPhoto = await compressImage(file);
    updatePhotoPreview();
  }
  document.getElementById("cameraInput").addEventListener("change", handlePhotoInput);
  document.getElementById("galleryInput").addEventListener("change", handlePhotoInput);

  document.getElementById("locBtn").onclick = () => {
    const sub = document.getElementById("locSub");
    if (!navigator.geolocation) { sub.textContent = "GPS tidak didukung di perangkat ini"; return; }
    sub.textContent = "Mengambil lokasi...";
    navigator.geolocation.getCurrentPosition(async (pos) => {
      pendingLat = pos.coords.latitude;
      pendingLng = pos.coords.longitude;
      sub.textContent = `Lokasi ditemukan (${pendingLat.toFixed(4)}, ${pendingLng.toFixed(4)})`;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pendingLat}&lon=${pendingLng}`);
        const data = await res.json();
        const addr = data.address || {};
        const name = [addr.road || addr.suburb || addr.neighbourhood, addr.city || addr.town || addr.village, addr.state]
          .filter(Boolean).join(", ");
        if (name) {
          document.getElementById("fLocation").value = name;
          sub.textContent = "Lokasi otomatis berhasil diambil";
        }
      } catch (err) {
        sub.textContent = "Koordinat didapat, nama lokasi tidak bisa dimuat (offline?)";
      }
    }, (err) => {
      sub.textContent = "Izin lokasi ditolak — isi lokasi secara manual di bawah";
    }, { enableHighAccuracy: true, timeout: 10000 });
  };

  document.getElementById("formSubmit").onclick = async () => {
    const title = document.getElementById("fTitle").value.trim();
    const caption = document.getElementById("fCaption").value.trim();
    if (!title && !caption) { showToast("Isi judul atau caption dulu, ya"); return; }
    const dtVal = document.getElementById("fDatetime").value;
    const item = {
      title,
      caption,
      location: document.getElementById("fLocation").value.trim(),
      lat: pendingLat,
      lng: pendingLng,
      tags: tagsToArray(document.getElementById("fTags").value),
      datetime: dtVal ? new Date(dtVal).toISOString() : new Date().toISOString(),
      photo: pendingPhoto,
      createdAt: Date.now()
    };
    if (editingId) item.id = editingId;
    await putItem(item);
    document.getElementById("formOverlay").classList.remove("show");
    allItems = await getAll();
    updateStatLine();
    renderCurrentView();
    showToast(editingId ? "Perubahan disimpan" : "Kenangan disimpan");
    editingId = null;
  };

  // ---------- Init ----------
  async function init(){
    db = await openDB();
    allItems = await getAll();
    updateStatLine();
    renderCurrentView();
  }
  init();

  // ---------- PWA: register service worker ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.warn("Service worker gagal didaftarkan:", err);
      });
    });
  }
})();
</script>
</body>
</html>
